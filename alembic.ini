# Alembic migration configuration.
#
# sqlalchemy.url is normally set by app/db/migrations/env.py from
# Settings.database_url at runtime. A guarded programmatic Config may inject an
# explicit test-worker URL; only the placeholder below is overwritten.
#
# This avoids hardcoding database credentials in config files.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = override_in_env_py

file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(hour).2d_%%(minute).2d_%%(slug)s
truncate_slug_length = 60

[post_write_hooks]
hooks = black, isort

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
