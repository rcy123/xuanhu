# ============================================================================
# 悬壶（Xuanhu）— Nginx 反向代理 TLS 模板（阶段 3 T3.4 / M4）
# ============================================================================
# 部署要点：
# 1. 后端 API 只监听内网（API_HOST=127.0.0.1 或容器 expose），TLS 由本
#    nginx 终止；uvicorn 本身不配 SSL（M4 缓解）。
# 2. access log 不记 query string —— 防止 SSE 的 ?token= 泄露（文档 01 §2.4）。
# 3. SSE 需要 proxy_buffering off + 长 read timeout。
# 4. 证书由院内 CA 签发或自签（内网可接受自签，需在客户端预置信任）。
#
# 挂载：
#   /etc/nginx/conf.d/xuanhu.conf
#   /etc/nginx/ssl/xuanhu.crt
#   /etc/nginx/ssl/xuanhu.key
# ============================================================================

log_format no_query '$remote_addr - $request_method $uri $status';

server {
    listen 443 ssl http2;
    server_name xuanhu.<hospital>.intranet;

    ssl_certificate     /etc/nginx/ssl/xuanhu.crt;
    ssl_certificate_key /etc/nginx/ssl/xuanhu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # 不记 query string（token 不落盘）
    access_log /var/log/nginx/xuanhu.log no_query;
    error_log  /var/log/nginx/xuanhu_error.log warn;

    # 健康检查与 Prometheus 探针（后端豁免认证）
    location = /api/v1/health { proxy_pass http://127.0.0.1:8000; }
    location = /api/v1/health/ready { proxy_pass http://127.0.0.1:8000; }
    location = /api/v1/health/llm { proxy_pass http://127.0.0.1:8000; }
    location = /api/v1/health/rag { proxy_pass http://127.0.0.1:8000; }
    location = /api/v1/health/outbox { proxy_pass http://127.0.0.1:8000; }
    location = /metrics { proxy_pass http://127.0.0.1:8000; }
    location = /metrics/outbox { proxy_pass http://127.0.0.1:8000; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE：关闭缓冲、长连接
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 请求体上限（问诊消息/病历）
        client_max_body_size 10m;
    }
}

# HTTP → HTTPS 强制跳转（生产内网亦可仅留 443）
server {
    listen 80;
    server_name xuanhu.<hospital>.intranet;
    return 301 https://$host$request_uri;
}
