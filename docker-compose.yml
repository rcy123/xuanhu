# ============================================================================
# 悬壶（Xuanhu）— 本地/内网中间件编排
# ============================================================================
# 用途：提供 PostgreSQL、Redis、Milvus standalone 及必要依赖的本地开发环境。
# 使用方式：cp .env.example .env && docker compose up -d
#
# 注意：本 compose 只启动中间件，不包含 FastAPI 后端和前端。
#       模型网关（MODEL_GATEWAY_BASE_URL）需由内网另行部署。
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 — 业务数据、知识库元数据、审计（权威记录系统）
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: xuanhu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xuanhu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xuanhu_dev}
      POSTGRES_DB: ${POSTGRES_DB:-xuanhu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xuanhu} -d ${POSTGRES_DB:-xuanhu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Redis 7 — checkpoint、会话锁、SSE 事件缓存（非权威缓存）
  # --------------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: xuanhu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-xuanhu_dev}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-xuanhu_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --------------------------------------------------------------------------
  # etcd — Milvus 元数据存储
  # --------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: xuanhu-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # MinIO — Milvus 对象存储
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: xuanhu-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Milvus standalone — 知识库向量检索（可重建索引）
  # --------------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: xuanhu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_METRICS_PORT:-9091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s

# ============================================================================
# 持久化卷
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local
