# ============================================================================
# 悬壶（Xuanhu）— 生产/内网中间件编排（阶段 3 加固）
# ============================================================================
# 安全边界：
# 1. 中间件端口一律不映射到 host（仅 expose 容器网络内可达），只允许 API
#    后端与反向代理容器访问（H5 修复）。
# 2. 凭据一律 ${VAR} 强必填，无 :-默认值；生产用 scripts/gen-secrets.sh
#    生成强随机凭据（H3 修复）。
# 3. 所有服务加资源限制与日志轮转（防日志撑爆磁盘）。
#
# 本地开发：自动加载 docker-compose.override.yml 加回端口与默认凭据。
# 生产部署：仅用本文件（docker compose -f docker-compose.yml up -d）。
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL 16 — 业务数据、知识库元数据、审计（权威记录系统）
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: xuanhu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-xuanhu}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-xuanhu}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # Redis 7 — checkpoint、会话锁、SSE 事件缓存（非权威缓存）
  # --------------------------------------------------------------------------
  redis:
    image: redis:7
    container_name: xuanhu-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # etcd — Milvus 元数据存储
  # --------------------------------------------------------------------------
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: xuanhu-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # MinIO — Milvus 对象存储（凭据强必填，控制台不对外）
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: xuanhu-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    command: minio server /minio_data --console-address ":9001"
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Milvus standalone — 知识库向量检索（可重建索引；内网明文可接受）
  # --------------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.5.4
    container_name: xuanhu-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    expose:
      - "19530"
      - "9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

# ============================================================================
# 持久化卷
# ============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local
