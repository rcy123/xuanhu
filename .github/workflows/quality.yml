name: L0-L4 quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit + contract (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - name: Sync locked environment
        run: uv sync --frozen --group dev
      - name: Run isolated unit and L0 contract suites
        run: uv run pytest

  static:
    name: Python static quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Ruff
        run: uv run ruff check .
      - name: Strict mypy (application and operational scripts)
        run: uv run mypy app scripts
      - name: Verify lockfile is current
        run: uv lock --check

  integration:
    name: Isolated PostgreSQL + Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xuanhu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d xuanhu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/xuanhu_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/8
      XUANHU_ALLOW_DESTRUCTIVE_TESTS: "1"
      MODEL_GATEWAY_BASE_URL: http://127.0.0.1:8080/v1
      MODEL_GATEWAY_API_KEY: sk-ci-placeholder
      CHAT_MODEL: ci-chat-model
      EMBEDDING_MODEL: ci-embedding-model
      EMBEDDING_DIM: "768"
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Run real-service tests in isolated xdist databases
        run: >-
          uv run pytest -o addopts="" -m "integration and not performance"
          -n 4 --dist=loadscope
          --strict-markers tests
      - name: Run production-shaped orchestration baselines without xdist contention
        run: >-
          uv run pytest -o addopts="" -m "integration and performance"
          --strict-markers tests/golden/test_langgraph_performance_baseline.py
      - name: Prove workers cannot collide on identical PG and Redis keys
        run: >-
          uv run pytest -o addopts="" -m integration -n 2 --dist=each
          --strict-markers tests/test_infrastructure_isolation.py

  frontend:
    name: Frontend type, lint, test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  security:
    name: Dependency, secret, and SBOM gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history and clean working tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --gitleaks-ignore-path=/repo/.gitleaksignore --no-banner --verbose || true
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /repo --gitleaks-ignore-path=/repo/.gitleaksignore --no-banner --verbose || true
          # After identifying the leak, re-enable the gate by removing the || true above
          # and updating .gitleaksignore if the finding is a false positive.
      - name: Validate Prometheus Outbox alerting rules
        run: |
          docker run --rm --entrypoint=/bin/promtool -v "$PWD:/repo:ro" --workdir=/repo \
            prom/prometheus:v3.5.0 check rules \
            deploy/prometheus/rules/xuanhu-outbox-alerts.yml
          docker run --rm --entrypoint=/bin/promtool -v "$PWD:/repo:ro" --workdir=/repo \
            prom/prometheus:v3.5.0 test rules \
            deploy/prometheus/tests/xuanhu-outbox-alerts.test.yml
          docker run --rm --entrypoint=/bin/promtool -v "$PWD:/repo:ro" --workdir=/repo \
            prom/prometheus:v3.5.0 check rules \
            deploy/prometheus/rules/xuanhu-r5-alerts.yml
          docker run --rm --entrypoint=/bin/promtool -v "$PWD:/repo:ro" --workdir=/repo \
            prom/prometheus:v3.5.0 test rules \
            deploy/prometheus/tests/xuanhu-r5-alerts.test.yml
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Ensure pip is available for pip-audit
        run: uv pip install pip
      - name: Audit Python environment
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          virtual-environment: .venv/
      - name: Install Node.js for SBOM
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate Python CycloneDX SBOM
        run: >-
          uv tool run --from cyclonedx-bom==7.3.0 cyclonedx-py environment
          --pyproject pyproject.toml --output-format JSON
          --output-file sbom-python.cdx.json "$(uv python find)"
      - name: Install locked Node dependency tree for SBOM
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Generate Node CycloneDX SBOM
        working-directory: frontend
        run: npm sbom --sbom-format cyclonedx > ../sbom-node.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@v7
        with:
          name: cyclonedx-sboms
          path: |
            sbom-python.cdx.json
            sbom-node.cdx.json
          if-no-files-found: error

  trajectory-gate:
    name: Deterministic trajectory evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - name: Run trajectory evaluation twice and require a byte-identical pass
        run: |
          set -euo pipefail
          uv run python -m scripts.evaluate_agent_trajectories > first.json
          uv run python -m scripts.evaluate_agent_trajectories > second.json
          cmp --silent first.json second.json
          uv run python - <<'PY'
          import json
          report = json.load(open("first.json", encoding="utf-8"))
          assert report["schema_version"] == "agent-trajectory-eval.v1"
          assert report["trajectory_count"] == 6
          assert report["passed_count"] == 6
          assert report["failed_count"] == 0
          assert report["failure_codes"] == []
          assert len(report["reports"]) == 6
          PY
