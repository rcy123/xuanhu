[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xuanhu"
version = "0.1.0"
description = "悬壶（Xuanhu）— 中医 AI 辅助诊疗 MVP"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { text = "UNLICENSED" }

dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.34,<1.0",
    "httpx>=0.28,<1.0",
    "sqlalchemy>=2.0.51",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "psycopg2-binary>=2.9.12",
    "pymilvus>=2.4,<3.0",
    "redis>=5.0,<6.0",
    "langgraph>=1.2.8",
    "langgraph-checkpoint-postgres>=3.1.0,<4.0",
    "psycopg>=3.3.4,<4.0",
    "psycopg-pool>=3.3.1,<4.0",
    "pypinyin>=0.55.0",
    "prometheus-client>=0.21,<1.0",
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<25.0",
]

[project.scripts]
xuanhu-api = "app.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-xdist>=3.8,<4.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "respx>=0.22,<1.0",
    "psycopg-binary>=3.3.4,<4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "T20", # flake8-print
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["T20"]  # scripts are CLI tools, print is expected
"app/api/*.py" = ["B008"]  # FastAPI Depends() in default args is idiomatic
"app/core/access.py" = ["B008"]  # FastAPI Depends() in default args is idiomatic
"tests/_l1_3_subprocess.py" = ["T20"]  # subprocess helper uses print for JSON output

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true

# 以下依赖尚未安装类型 stub，在此声明以避免 mypy 报错
# 后续 P1-2 等任务可按需引入 types-* 包并移除对应条目
[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "httpx.*",
    "pymilvus.*",
    "requests",
    "playwright",
    "playwright.*",
    "pypinyin",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "-m",
    "not integration",
]

markers = [
    "integration: tests requiring real PostgreSQL, Redis, Milvus, network, or process-level infrastructure",
    "performance: production-shaped orchestration baselines that must run without xdist contention",
]

[dependency-groups]
dev = [
    "playwright>=1.61.0",
    "mypy>=1.13,<2.0",
    "psycopg-binary>=3.3.4,<4.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=1.0,<2.0",
    "pytest-xdist>=3.8,<4.0",
    "respx>=0.22,<1.0",
    "ruff>=0.8,<1.0",
]
